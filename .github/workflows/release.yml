name: Release

on:
  push:
    tags:
      - 'v*'   # v2.0.0 などのタグで Release を作成

permissions:
  contents: write   # Release 作成に必須

jobs:
  # テストが通った場合のみ Release を作成する
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe のために必須

      - name: Get version from tag
        id: get_version
        run: |
          $tag = git describe --tags --abbrev=0
          echo "version=$tag" >> $env:GITHUB_OUTPUT

      # タグと src/cellcounter/__init__.py の __version__ が一致しなければ中止する
      #（バージョンは __init__.py の 1 か所で管理。pyproject.toml はそこから読み取る）
      - name: Check version
        run: |
          $tag = "${{ steps.get_version.outputs.version }}".TrimStart("v")
          $m = Select-String -Path src/cellcounter/__init__.py -Pattern '__version__ = "(.*)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($tag -ne $ver) {
            Write-Error "タグ v$tag と __init__.py の __version__ ($ver) が一致しません。__init__.py を更新してからタグを付けてください。"
            exit 1
          }
          echo "version OK: $ver"

      # ---------------------------------------------
      # Release ノート自動生成（コミットログ）
      # ---------------------------------------------
      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          # 現在のタグ
          $current = "${{ steps.get_version.outputs.version }}"

          # タグ一覧（version ソート）
          $tags = git tag --sort=version:refname | ForEach-Object { $_.Trim() }

          if ($tags.Count -eq 0) {
            $log = "(no tags found)"
          }
          else {
            # current のインデックス
            $idx = $tags.IndexOf($current)

            if ($idx -lt 0) {
              $log = "(current tag '$current' not found in tag list)"
            }
            else {
              # 前のタグ
              if ($idx -eq 0) {
                $prev = ""
              }
              else {
                $prev = $tags[$idx - 1]
              }

              if ([string]::IsNullOrEmpty($prev)) {
                $log = "(no previous tag)"
              }
              else {
                # git log は GitHub Actions の pwsh では常に配列として返る
                $logLines = git log "$prev..$current" --pretty=format:"- %s (%h)"

                if ($logLines.Count -eq 0) {
                  $log = "(no commits between $prev and $current)"
                }
                else {
                  $log = $logLines -join "`n"
                }
              }
            }
          }

          # Release ノート本文
          $body = "## Changes in $current`n`n$log`n`n_Automatically generated from commit history._"

          # 出力
          $body | Out-File release_notes.txt -Encoding utf8
          echo "body<<EOF" >> $env:GITHUB_OUTPUT
          Get-Content release_notes.txt >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------
      # ZIP 作成（ソース一式：CellCounter.bat から起動）
      # ---------------------------------------------
      - name: Create zip
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item -Recurse src, CellCounter.bat, pyproject.toml, README.md, LICENSE publish/
          Get-ChildItem publish -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          7z a -tzip CellCounter-${{ steps.get_version.outputs.version }}.zip .\publish\*

      # ---------------------------------------------
      # Release にアップロード
      # ---------------------------------------------
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CellCounter-${{ steps.get_version.outputs.version }}.zip
          body: ${{ steps.notes.outputs.body }}
